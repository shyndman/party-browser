<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PartyBrowser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f0f12;
      --bg-secondary: #18181d;
      --bg-tertiary: #1f1f26;
      --border-color: #2a2a35;
      --border-accent: #3d3d4a;
      --text-primary: #e8e8ed;
      --text-secondary: #9898a6;
      --text-muted: #6b6b78;
      --accent: #8b7cf7;
      --accent-glow: rgba(139, 124, 247, 0.15);
      --success: #4ade80;
      --success-glow: rgba(74, 222, 128, 0.2);
      --danger: #f87171;
      --danger-glow: rgba(248, 113, 113, 0.2);
      --warning: #fbbf24;
    }

    body {
      width: 340px;
      padding: 20px;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
      font-size: 13px;
      color: var(--text-primary);
      background: var(--bg-primary);
      /* Subtle noise texture */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }

    /* Decorative corner borders */
    .corner-box {
      position: relative;
      padding: 16px;
      background: var(--bg-secondary);
    }

    .corner-box::before,
    .corner-box::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--border-accent);
      border-style: solid;
    }

    .corner-box::before {
      top: 0;
      left: 0;
      border-width: 2px 0 0 2px;
    }

    .corner-box::after {
      bottom: 0;
      right: 0;
      border-width: 0 2px 2px 0;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border-color);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.3;
    }

    .icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 
        0 0 0 1px rgba(139, 124, 247, 0.3),
        0 4px 12px rgba(0, 0, 0, 0.4),
        0 0 20px var(--accent-glow);
      position: relative;
    }

    /* Crosshatch pattern on icon */
    .icon::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 2px,
        rgba(255, 255, 255, 0.03) 2px,
        rgba(255, 255, 255, 0.03) 4px
      );
    }

    .title {
      flex: 1;
    }

    .title h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    /* Section labels */
    .section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::before,
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-color), transparent);
    }

    .section-label::after {
      background: linear-gradient(90deg, transparent, var(--border-color));
    }

    /* Status section */
    .status-section {
      margin-bottom: 18px;
    }

    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
    }

    /* Subtle scan line effect */
    .status-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        var(--border-accent) 20%, 
        var(--border-accent) 80%, 
        transparent 100%
      );
    }

    .status-item:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      position: relative;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success-glow), 0 0 2px var(--success);
      animation: pulse-green 2s ease-in-out infinite;
    }

    .status-dot.disconnected {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger-glow), 0 0 2px var(--danger);
    }

    .status-dot.unknown {
      background: var(--warning);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 8px var(--success-glow), 0 0 2px var(--success); }
      50% { box-shadow: 0 0 16px var(--success-glow), 0 0 4px var(--success); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-value.connected {
      color: var(--success);
    }

    .status-value.disconnected {
      color: var(--danger);
    }

    /* Kill switch */
    .kill-switch-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 18px;
      position: relative;
    }

    /* Hatched corner accent */
    .kill-switch-container::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 24px;
      height: 24px;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 3px,
        var(--border-accent) 3px,
        var(--border-accent) 4px
      );
      clip-path: polygon(100% 0, 0 0, 100% 100%);
      opacity: 0.5;
    }

    .kill-switch-label {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    .kill-switch-btn {
      padding: 8px 18px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      min-width: 100px;
    }

    .kill-switch-btn.enabled {
      background: var(--success);
      color: #0a2612;
      box-shadow: 0 0 12px var(--success-glow);
    }

    .kill-switch-btn.enabled:hover {
      background: #3bd472;
      box-shadow: 0 0 20px var(--success-glow);
    }

    .kill-switch-btn.disabled {
      background: var(--danger);
      color: #2a0a0a;
      box-shadow: 0 0 12px var(--danger-glow);
    }

    .kill-switch-btn.disabled:hover {
      background: #f55a5a;
      box-shadow: 0 0 20px var(--danger-glow);
    }

    /* Info section */
    .info-section {
      margin-bottom: 18px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dotted var(--border-color);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .info-label::before {
      content: '›';
      margin-right: 6px;
      color: var(--accent);
      opacity: 0.6;
    }

    .info-value {
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 12px;
      font-family: 'SF Mono', 'Monaco', monospace;
    }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      flex: 1;
      padding: 11px 16px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      background: var(--bg-secondary);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f0f12;
    }

    .btn-primary:hover {
      background: #9d90f9;
      border-color: #9d90f9;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    /* Footer */
    .footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-color);
      text-align: center;
      position: relative;
    }

    .footer::before {
      content: '◆';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: var(--border-accent);
      background: var(--bg-primary);
      padding: 0 8px;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .footer a:hover {
      color: var(--accent);
    }

    /* Error message */
    .error-message {
      padding: 12px 14px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-left: 3px solid var(--danger);
      border-radius: 4px;
      color: var(--danger);
      font-size: 12px;
      margin-bottom: 14px;
    }

    /* Loading */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">🌐</div>
    <div class="title">
      <h1>PartyBrowser</h1>
      <p>MCP Server Automation</p>
    </div>
  </div>

  <div class="kill-switch-container">
    <span class="kill-switch-label">MCP Control</span>
    <button class="kill-switch-btn enabled" id="kill-switch-btn">Enabled</button>
  </div>

  <div class="section-label">Status</div>

  <div class="status-section">
    <div class="status-item">
      <span class="status-label">MCP Server</span>
      <span class="status-value" id="server-status">
        <span class="status-dot unknown" id="server-dot"></span>
        <span id="server-text">Checking...</span>
      </span>
    </div>
  </div>

  <div class="section-label">Info</div>

  <div class="info-section">
    <div class="info-row">
      <span class="info-label">Active Tabs</span>
      <span class="info-value" id="tab-count">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">Current URL</span>
      <span class="info-value" id="current-url" style="max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="refresh-btn">Refresh</button>
  </div>

  <div class="footer">
    <a href="https://browsermcp.io" target="_blank">browsermcp.io</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
