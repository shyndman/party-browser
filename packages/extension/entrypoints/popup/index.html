<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PartyBrowser</title>
  <style>
    /* ================================================================
       PartyBrowser Popup — "The Velvet Rope"
       ================================================================ */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f6f5fb;
      color: #1a1025;
      width: 380px;
      max-height: 580px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* Subtle custom scrollbar */
    body::-webkit-scrollbar { width: 6px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb {
      background: #c4b5fd;
      border-radius: 3px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    .header {
      background: #0f0a1a;
      background-image: radial-gradient(
        ellipse at 30% -20%,
        rgba(139, 92, 246, 0.18) 0%,
        transparent 60%
      );
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #8b5cf6 0%, #c026d3 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-icon svg {
      display: block;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: #ede9fe;
      letter-spacing: -0.3px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Connection Indicator ───────────────────────────────────────── */
    .status-value {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      flex-shrink: 0;
      transition: background 0.3s ease;
    }

    .status-dot.connected {
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .status-dot.disconnected {
      background: #f87171;
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.2);
    }

    .status-dot.unknown {
      background: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25); }
      50% { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
    }

    #server-text {
      font-size: 11px;
      font-weight: 600;
      color: #a78bfa;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .status-value.connected #server-text { color: #6ee7b7; }
    .status-value.disconnected #server-text { color: #fca5a5; }

    /* ── Open/Closed Toggle (Kill Switch) ──────────────────────────── */
    .kill-switch-btn {
      padding: 5px 11px;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      line-height: 1;
      background: transparent;
    }

    .kill-switch-btn.enabled {
      background: rgba(52, 211, 153, 0.15);
      color: #6ee7b7;
      border-color: rgba(52, 211, 153, 0.35);
    }

    .kill-switch-btn.enabled:hover {
      background: rgba(52, 211, 153, 0.25);
      border-color: rgba(52, 211, 153, 0.5);
    }

    .kill-switch-btn.disabled {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
      border-color: rgba(248, 113, 113, 0.25);
    }

    .kill-switch-btn.disabled:hover {
      background: rgba(248, 113, 113, 0.2);
      border-color: rgba(248, 113, 113, 0.4);
    }

    .kill-switch-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Main Content ──────────────────────────────────────────────── */
    .main {
      padding: 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #8b8598;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Count Badge ───────────────────────────────────────────────── */
    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      background: #8b5cf6;
      color: white;
      font-size: 11px;
      font-weight: 800;
      border-radius: 100px;
      line-height: 1;
    }

    /* ── Empty State ───────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 44px 24px 48px;
    }

    .empty-visual {
      margin-bottom: 16px;
      opacity: 0.35;
    }

    .empty-text {
      font-size: 15px;
      font-weight: 600;
      color: #8b8598;
      margin-bottom: 4px;
    }

    .empty-sub {
      font-size: 12px;
      color: #b0aabb;
      line-height: 1.4;
    }

    /* ── Guest Cards (populated by TS) ─────────────────────────────── */
    .waiting-room-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .waiting-room-row {
      background: white;
      border: 1px solid #e8e4f0;
      border-radius: 12px;
      padding: 14px 16px;
      border-left: 4px solid #8b5cf6;
      transition: box-shadow 0.2s ease, border-left-color 0.2s ease;
    }

    .waiting-room-row:hover {
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.1);
      border-left-color: #a78bfa;
    }

    .row-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .row-name {
      font-size: 14px;
      font-weight: 700;
      color: #1a1025;
      line-height: 1.3;
    }

    .row-time {
      font-size: 11px;
      color: #b0aabb;
      white-space: nowrap;
      font-weight: 500;
      flex-shrink: 0;
    }

    .row-reason {
      font-size: 13px;
      color: #6b6478;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .row-url {
      font-size: 11px;
      font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      color: #7c3aed;
      background: #f5f3ff;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 12px;
    }

    .row-actions {
      display: flex;
      gap: 8px;
    }

    .row-btn {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1.5px solid transparent;
      letter-spacing: 0.2px;
    }

    .row-btn:active:not(:disabled) {
      transform: scale(0.97);
    }

    .row-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Admit */
    .row-btn.join {
      background: #059669;
      color: white;
      border-color: #059669;
    }

    .row-btn.join:hover:not(:disabled) {
      background: #047857;
      border-color: #047857;
      box-shadow: 0 2px 8px rgba(5, 150, 105, 0.3);
    }

    /* Turn away — starts quiet, escalates on hover */
    .row-btn.reject {
      background: transparent;
      color: #a8a1b5;
      border-color: #ddd8e8;
    }

    .row-btn.reject:hover:not(:disabled) {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fca5a5;
    }

    .action-error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 8px;

      padding: 10px 12px;
      margin-bottom: 10px;

      font-size: 13px;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* ── Visually-hidden compat elements ────────────────────────────── */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- ── Header bar ── -->
  <header class="header">
    <div class="header-brand">
      <div class="header-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 13L7 5.5L10.5 9.5L3 13Z" fill="white" fill-opacity="0.9"/>
          <path d="M8 4.5L10 1" stroke="white" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M11.5 6.5L14 4.5" stroke="white" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10 2.5L13 1.5" stroke="white" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
          <circle cx="10.5" cy="1" r="1" fill="white" fill-opacity="0.7"/>
          <circle cx="14.5" cy="4" r="0.8" fill="white" fill-opacity="0.5"/>
        </svg>
      </div>
      <span class="header-title">PartyBrowser</span>
    </div>
    <div class="header-right">
      <div class="status-value" id="server-status">
        <span class="status-dot unknown" id="server-dot"></span>
        <span id="server-text">Checking…</span>
      </div>
      <button class="kill-switch-btn disabled" id="kill-switch-btn">Disabled</button>
    </div>
  </header>

  <!-- ── Waiting Room ── -->
  <main class="main">
    <div class="section-header">
      <span class="section-title">At the Door</span>
      <span class="count-badge" id="waiting-room-count">0</span>
    </div>

    <!-- Feedback survives removal and refresh of the failed request. -->
    <p class="action-error" id="action-error" role="alert" hidden></p>

    <!-- Empty state -->
    <div class="empty-state" id="waiting-room-empty">
      <div class="empty-visual">
        <svg width="80" height="56" viewBox="0 0 80 56" fill="none">
          <!-- Left stanchion -->
          <rect x="17" y="14" width="4" height="34" rx="2" fill="#c4b5fd"/>
          <circle cx="19" cy="11" r="5" fill="#ddd6fe"/>
          <circle cx="19" cy="11" r="2.5" fill="#c4b5fd"/>
          <!-- Right stanchion -->
          <rect x="59" y="14" width="4" height="34" rx="2" fill="#c4b5fd"/>
          <circle cx="61" cy="11" r="5" fill="#ddd6fe"/>
          <circle cx="61" cy="11" r="2.5" fill="#c4b5fd"/>
          <!-- Velvet rope -->
          <path d="M24 21 Q40 34 56 21" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <p class="empty-text">Nobody's knocking</p>
      <p class="empty-sub">Agents will appear here when they request access</p>
    </div>

    <!-- Entry list — TS populates via renderWaitingRoom() -->
    <div class="waiting-room-list" id="waiting-room-list"></div>
  </main>

  <!-- Hidden: TS compat elements (still referenced by getElementById) -->
  <span id="tab-count" class="sr-only">-</span>
  <span id="current-url" class="sr-only">-</span>
  <button id="refresh-btn" class="sr-only" aria-hidden="true"></button>

  <script type="module" src="./index.ts"></script>
</body>
</html>
